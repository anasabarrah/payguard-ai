# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: payguard-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      # Secrets: Render asks for these values when the Blueprint is created.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Sandbox buyer login shown on /shop/ for the judges (optional).
      - key: JUDGE_BUYER_EMAIL
        sync: false
      - key: JUDGE_BUYER_PASSWORD
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
